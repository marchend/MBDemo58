name: AcmeBank
options:
  bundleIdPrefix: com.acmebank
  deploymentTarget:
    iOS: "17.0"
packages:
  OktaMobile:
    url: https://github.com/okta/okta-mobile-swift
    from: "2.0.0"
targets:
  AcmeBank:
    type: application
    platform: iOS
    sources: [AcmeBank]
    dependencies:
      - package: OktaMobile
        product: OktaDirectAuth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.acmebank.mobile
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: AcmeBank
        CODE_SIGN_ENTITLEMENTS: AcmeBank/AcmeBank.entitlements
        # Seed Okta config keys with empty strings so the "Inject Okta
        # configuration" pre-build script's `plutil -replace` has something
        # to overwrite. Real values come from build-machine env vars at
        # build time — never commit Okta tenant values.
        INFOPLIST_KEY_OktaIssuer: ""
        INFOPLIST_KEY_OktaClientID: ""
        INFOPLIST_KEY_OktaRedirectURI: ""
        INFOPLIST_KEY_OktaScopes: ""
    preBuildScripts:
      - name: Inject Okta configuration
        script: |
          #!/bin/sh
          set -e
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          plutil -replace OktaIssuer -string "${OKTA_ISSUER:?OKTA_ISSUER not set}" "$PLIST"
          plutil -replace OktaClientID -string "${OKTA_CLIENT_ID:?OKTA_CLIENT_ID not set}" "$PLIST"
          plutil -replace OktaRedirectURI -string "${OKTA_REDIRECT_URI:?OKTA_REDIRECT_URI not set}" "$PLIST"
          plutil -replace OktaScopes -string "${OKTA_SCOPES:?OKTA_SCOPES not set}" "$PLIST"
  AcmeBankTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AcmeBankTests]
    dependencies:
      - target: AcmeBank
schemes:
  AcmeBank:
    build:
      targets: { AcmeBank: all }
    test:
      targets: [AcmeBankTests]
